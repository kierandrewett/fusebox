[package]
name = "fusebox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tapoctl = { git = "https://github.com/kierandrewett/tapoctl", version = "0.1.0" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
