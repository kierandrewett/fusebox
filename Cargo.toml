[package]
name = "fusebox"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.42", features = ["clock"], default-features = false }
cron = "0.16.0"
rust_xlsxwriter = "0.94.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tapo = "0.9.0"
tapoctl = { git = "https://github.com/kierandrewett/tapoctl", version = "0.1.0" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
