services:
  fusebox:
    build:
      context: .
      dockerfile: Dockerfile
    image: fusebox:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FUSEBOX_BIND: 0.0.0.0:8787
      FUSEBOX_STATE_PATH: /data/state.json
      RUST_LOG: info
    expose:
      - "8787"
    volumes:
      - fusebox-state:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  intranet:
    external: true

volumes:
  fusebox-state:
